<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 400" width="120" height="400" preserveAspectRatio="none" role="presentation">
  <defs>
    <linearGradient id="wax" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9c8a6"/>
      <stop offset="28%" stop-color="#f7ecd6"/>
      <stop offset="62%" stop-color="#f2e2c6"/>
      <stop offset="100%" stop-color="#cbb894"/>
    </linearGradient>
  </defs>

  <!--
    Drawn to be clipped from the TOP as the session burns down, so the base and
    its drips stay put. preserveAspectRatio="none" is deliberate: the wrapper
    changes this element's height, and the column should shorten rather than
    shrink away.
  -->
  <rect x="14" y="0" width="92" height="400" rx="10" fill="url(#wax)"/>

  <!-- Melted lip, sits at the very top of whatever is left -->
  <ellipse cx="60" cy="6" rx="46" ry="9" fill="#fbf3e4"/>

  <!-- Drips, low enough to survive most of the burn -->
  <path fill="#fbf3e4" opacity="0.9" d="M22 300 c0 26 12 30 12 54 c0 10 -12 10 -12 0 Z"/>
  <path fill="#fbf3e4" opacity="0.75" d="M96 336 c0 20 10 24 10 42 c0 8 -10 8 -10 0 Z"/>
</svg>
