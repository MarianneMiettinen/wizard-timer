<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="presentation">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0820"/>
      <stop offset="45%" stop-color="#1a1440"/>
      <stop offset="100%" stop-color="#2a1f50"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f0d99a" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#f0d99a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f0d99a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#221a4a"/>
      <stop offset="100%" stop-color="#171139"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120e2e"/>
      <stop offset="100%" stop-color="#0a0720"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Stars: fixed positions so the sky never reflows or animates. -->
  <g fill="#f4eeda">
    <circle cx="120" cy="90" r="1.8" opacity="0.9"/>
    <circle cx="260" cy="160" r="1.2" opacity="0.6"/>
    <circle cx="400" cy="70" r="2.1" opacity="0.85"/>
    <circle cx="540" cy="200" r="1.1" opacity="0.5"/>
    <circle cx="700" cy="120" r="1.7" opacity="0.75"/>
    <circle cx="860" cy="60" r="1.3" opacity="0.65"/>
    <circle cx="980" cy="180" r="2.0" opacity="0.8"/>
    <circle cx="1120" cy="110" r="1.2" opacity="0.55"/>
    <circle cx="1280" cy="220" r="1.6" opacity="0.7"/>
    <circle cx="1420" cy="90" r="1.9" opacity="0.85"/>
    <circle cx="1540" cy="190" r="1.1" opacity="0.5"/>
    <circle cx="180" cy="300" r="1.3" opacity="0.45"/>
    <circle cx="620" cy="330" r="1.5" opacity="0.5"/>
    <circle cx="1060" cy="310" r="1.2" opacity="0.45"/>
    <circle cx="1480" cy="350" r="1.4" opacity="0.4"/>
    <circle cx="330" cy="240" r="1.0" opacity="0.4"/>
    <circle cx="770" cy="260" r="1.0" opacity="0.4"/>
    <circle cx="1200" cy="40" r="1.0" opacity="0.5"/>
  </g>

  <!-- Moon -->
  <circle cx="1260" cy="180" r="220" fill="url(#moonGlow)"/>
  <circle cx="1260" cy="180" r="62" fill="#f4e6bc"/>
  <circle cx="1238" cy="164" r="12" fill="#e2d0a2" opacity="0.55"/>
  <circle cx="1276" cy="200" r="8" fill="#e2d0a2" opacity="0.45"/>
  <circle cx="1284" cy="152" r="5" fill="#e2d0a2" opacity="0.4"/>

  <!-- Far ridge with the school's towers -->
  <path fill="url(#hillFar)" d="M0 640 L120 606 L240 628 L360 588 L470 616 L600 570 L720 604 L840 566 L980 600 L1110 560 L1240 596 L1380 566 L1500 598 L1600 574 L1600 900 L0 900 Z"/>
  <g fill="#171139">
    <path d="M300 590 h54 v-96 l27-46 l27 46 v96 h54 v210 h-162 Z"/>
    <path d="M470 606 h40 v-70 l20-34 l20 34 v70 h40 v194 h-120 Z"/>
    <path d="M980 596 h64 v-118 l32-54 l32 54 v118 h64 v230 h-192 Z"/>
  </g>
  <!-- Lit windows -->
  <g fill="#f0b849" opacity="0.75">
    <rect x="336" y="612" width="12" height="20" rx="6"/>
    <rect x="392" y="656" width="12" height="20" rx="6"/>
    <rect x="1024" y="620" width="14" height="24" rx="7"/>
    <rect x="1094" y="668" width="14" height="24" rx="7"/>
    <rect x="512" y="628" width="10" height="18" rx="5"/>
  </g>

  <!-- Near ridge -->
  <path fill="url(#hillNear)" d="M0 742 L160 716 L320 748 L500 710 L680 746 L860 706 L1040 744 L1220 712 L1400 748 L1600 716 L1600 900 L0 900 Z"/>
</svg>
