<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 640" width="420" height="640" role="presentation">
  <defs>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4b3d8f"/>
      <stop offset="100%" stop-color="#2a2160"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a4aa5"/>
      <stop offset="100%" stop-color="#372b73"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff3cf"/>
      <stop offset="45%" stop-color="#f0b849"/>
      <stop offset="100%" stop-color="#f0b849" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Staff, behind the figure -->
  <rect x="316" y="150" width="12" height="440" rx="6" fill="#6b4b2a"/>
  <circle cx="322" cy="150" r="54" fill="url(#orb)"/>
  <circle cx="322" cy="150" r="18" fill="#ffe9ae"/>

