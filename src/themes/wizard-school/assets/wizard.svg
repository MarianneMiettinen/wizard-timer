  <ellipse cx="210" cy="152" rx="102" ry="26" fill="#463891"/>
  <ellipse cx="210" cy="146" rx="102" ry="26" fill="#5a4aa5"/>
  <!-- Hat band + star -->
  <path fill="#f0b849" d="M172 120 c24 8 52 8 76 0 l6 22 c-28 10 -60 10 -88 0 Z" opacity="0.9"/>
  <path fill="#ffe9ae" d="M210 44 l6 14 l15 2 l-11 11 l3 15 l-13 -8 l-13 8 l3 -15 l-11 -11 l15 -2 Z"/>
