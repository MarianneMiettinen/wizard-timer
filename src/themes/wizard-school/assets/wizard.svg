  <!-- Sleeves -->
  <path fill="#3a2f7a" d="M118 268 c-26 24 -40 64 -42 108 l34 8 c6 -44 18 -76 36 -94 Z"/>
  <path fill="#3a2f7a" d="M302 268 c26 24 40 64 42 108 l-34 8 c-6 -44 -18 -76 -36 -94 Z"/>

  <!-- Collar -->
  <path fill="#f0b849" d="M164 218 h92 l-14 30 h-64 Z" opacity="0.85"/>

