  <path fill="#12102c" opacity="0.35" d="M164 168 a46 50 0 0 1 92 0 Z"/>
  <!-- Beard -->
  <path fill="#e6e2d6" d="M172 196 c8 62 22 96 38 96 s30 -34 38 -96 c-12 12 -26 18 -38 18 s-26 -6 -38 -18 Z"/>
  <!-- Eyes -->
